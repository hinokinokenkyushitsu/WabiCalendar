name: Release

on:
  push:
    tags: ['v*']
  # Re-runnable by hand: dispatch it with the tag as the ref.
  workflow_dispatch:

# Creating the draft release and uploading assets to it.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  # Never cancel: a half-uploaded release is worse than a duplicated run.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse anything that is not a tag
        if: github.ref_type != 'tag'
        run: |
          echo "This workflow builds a tag; dispatch it with a tag as the ref." >&2
          exit 1

      - id: check
        run: .github/scripts/check-versions.sh "${{ github.ref_name }}"

      # The release is made here rather than by tauri-action so that three
      # parallel builds cannot each decide it is the one that has to create it.
      # They are handed its id and only upload.
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          # `releases/tags/<tag>` does not return drafts, so list and match.
          # Only for re-runs: creating one hands back its id directly, which the
          # list endpoint does not yet know about in the second it takes to ask.
          find_release() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
              --jq "[.[] | select(.tag_name == \"$TAG\")] | .[0].id // empty"
          }
          id=$(find_release)
          if [ -z "$id" ]; then
            cat > notes.md <<'NOTES'
          The app and `calpo` each have a matching `.sha256` beside them.

          The macOS build is not signed or notarised. The first time you open it,
          right-click the app and choose Open, or run
          `xattr -dr com.apple.quarantine /Applications/CalenPomo.app`.

          `calpo` is the command line half; put it anywhere on your PATH.
          NOTES
            id=$(jq -n \
                  --arg tag "$TAG" \
                  --arg name "CalenPomo $VERSION" \
                  --rawfile body notes.md \
                  '{tag_name: $tag, name: $name, draft: true, body: $body}' \
                | gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
                    --input - --jq .id)
          fi
          # An empty id is how tauri-action is told to upload nothing at all,
          # which it does silently, so it is worth refusing to continue here.
          [ -n "$id" ] || { echo "no release id for $TAG" >&2; exit 1; }
          echo "release_id=$id" >> "$GITHUB_OUTPUT"
          echo "release $id for $TAG"

  bundle:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # bash on Windows too, so that one script per step works everywhere.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            # One download for both kinds of Mac. `app` is named alongside the
            # dmg because the bundler refuses to make updater artifacts unless
            # an updater-enabled target (app, appimage, msi, nsis -- not dmg)
            # was asked for; it is also the form install.sh wants, and
            # tauri-action uploads it as the .app.tar.gz the updater consumes.
            args: --target universal-apple-darwin --bundles app,dmg
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            cli: calpo-macos-universal
          - name: Linux (x86_64)
            # Not ubuntu-latest: an AppImage carries whatever glibc it was
            # linked against, so one built on 24.04 refuses to start on 22.04
            # and on Debian 12.
            os: ubuntu-22.04
            args: --bundles appimage
            rust_targets: ''
            cli: calpo-linux-x86_64
          - name: Windows (x86_64)
            os: windows-latest
            args: --bundles nsis
            rust_targets: ''
            cli: calpo-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # A release build shares nothing with the debug one CI caches.
          key: release

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            file \
            patchelf

      # tauri-action does not do this for us, and `beforeBuildCommand` is
      # `npm run build`.
      - run: npm ci

      # Before the bundler, not after: it copies every binary the Cargo package
      # declares into the app, and for a universal build it only lipos the app's
      # own -- so target/universal-apple-darwin/release/calpo has to be there
      # already or bundling stops with "does not exist". The other two platforms
      # need no such help: `cargo build --release` builds both bins in place.
      - name: Build calpo (universal)
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --manifest-path src-tauri/Cargo.toml \
              --release --no-default-features --bin calpo --target "$target"
          done
          universal=src-tauri/target/universal-apple-darwin/release
          mkdir -p "$universal"
          lipo -create -output "$universal/calpo" \
            src-tauri/target/aarch64-apple-darwin/release/calpo \
            src-tauri/target/x86_64-apple-darwin/release/calpo
          cp "$universal/calpo" "artifacts/${{ matrix.cli }}"

      - name: Build and upload the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without these the bundler stops at "a public key has been found,
          # but no private key" -- and an unsigned bundle is one no installed
          # copy would accept anyway.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}
          # The action writes latest.json by reading whatever is on the release,
          # adding its own platform and writing it back -- three jobs doing that
          # at once keep whichever finishes last. The `latest-json` job below
          # assembles it once, from the signatures, after all three have landed.
          # (Spelled `uploadUpdaterJson` on the action's dev branch; this is what
          # the v0 tag answers to, and an unknown input is only a warning.)
          includeUpdaterJson: false

      # `calpo` is built and attached by hand -- without the `gui` feature, which
      # is what keeps it clear of Tauri's system dependencies.
      - name: Build calpo
        if: runner.os != 'macOS'
        run: |
          mkdir -p artifacts
          cargo build --manifest-path src-tauri/Cargo.toml \
            --release --no-default-features --bin calpo
          source=src-tauri/target/release/calpo
          if [ "$RUNNER_OS" = Windows ]; then
            source=$source.exe
          fi
          cp "$source" "artifacts/${{ matrix.cli }}"

      # The one piece tauri-action knows nothing about. Checksums for everything,
      # this included, are made by the `finish` job from the uploaded assets.
      - name: Attach calpo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "artifacts/${{ matrix.cli }}" --clobber

  # Everything that can only be done once all three platforms have landed.
  finish:
    name: checksums and latest.json
    needs: [prepare, bundle]
    runs-on: ubuntu-22.04
    # This job checks nothing out, and `gh release` asks git which repository it
    # is in unless told. `gh api` never needed it -- the repository is in the URL
    # there -- which is why the first run got all the way to the last command
    # before saying "not a git repository", and why the release notes came back
    # empty instead of failing.
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      # Hashed from the assets as they now exist, never from the local build
      # output: tauri-action renames some of what it uploads (the macOS tarball
      # gains its architecture), and a checksum filed under a name nothing is
      # served as helps nobody. install.sh looks for exactly `<asset>.sha256`.
      - name: Checksum every asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          mkdir -p sums
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq '.[] | "\(.id) \(.name)"' \
            | while read -r id name; do
                # A signature is checked by the updater, not by a person, and
                # latest.json is not uploaded yet.
                case "$name" in
                  *.sha256 | *.sig) continue ;;
                esac
                gh api "repos/$GITHUB_REPOSITORY/releases/assets/$id" \
                  -H "Accept: application/octet-stream" > "sums/$name"
                (cd sums && sha256sum "$name" > "$name.sha256" && rm "$name")
              done
          ls sums
          gh release upload "$TAG" sums/*.sha256 --clobber

      # What an installed copy reads when the user picks "Check for Updates…".
      # One job rather than three because assembling it means reading every
      # platform's signature at once, and because the URLs have to be the ones
      # the tag will serve -- a draft's own asset URLs are not those.
      - name: Assemble latest.json from the signatures and attach it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          platforms='{}'

          # Every updater artifact on the release is named by its signature:
          # drop the .sig and you have the file it signs.
          while read -r id name; do
            case "$name" in
              *.sig) ;;
              *) continue ;;
            esac
            bundle=${name%.sig}

            # The plugin looks up `{os}-{arch}` and nothing else -- there is no
            # "universal" key it falls back to -- so the one Mac build is listed
            # under both architectures.
            case "$bundle" in
              *.app.tar.gz) keys="darwin-aarch64 darwin-x86_64" ;;
              *.AppImage)   keys="linux-x86_64" ;;
              *-setup.exe)  keys="windows-x86_64" ;;
              *)
                echo "not an updater artifact, skipping: $bundle" >&2
                continue
                ;;
            esac

            # A draft release's assets are not public yet, so this reads the
            # signature through the API rather than from the download URL.
            signature=$(gh api "repos/$GITHUB_REPOSITORY/releases/assets/$id" \
              -H "Accept: application/octet-stream")

            for key in $keys; do
              platforms=$(jq --arg key "$key" --arg url "$base/$bundle" --arg signature "$signature" \
                '.[$key] = {signature: $signature, url: $url}' <<<"$platforms")
            done
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq '.[] | "\(.id) \(.name)"')

          # Three platforms, four keys. Anything less means a build produced no
          # signature, and shipping the file anyway would leave those users
          # being told there is no update rather than that something is wrong.
          found=$(jq 'keys | length' <<<"$platforms")
          if [ "$found" -ne 4 ]; then
            echo "expected 4 platform keys, found $found:" >&2
            jq -r 'keys[]' <<<"$platforms" >&2
            exit 1
          fi

          jq -n \
            --arg version "$VERSION" \
            --arg notes "$(gh release view "$TAG" --json body --jq .body)" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$platforms" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
            > latest.json

          jq '.platforms |= map_values(.signature |= "<\(. | length) bytes>")' latest.json
          gh release upload "$TAG" latest.json --clobber
