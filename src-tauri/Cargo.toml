[package]
name = "calenpomo"
version = "0.1.0"
description = "Local-first calendar and pomodoro timer"
authors = ["Hinoki"]
edition = "2021"
# With two binaries in the package, a bare `cargo run` has no way to choose --
# and `npm run tauri dev` runs exactly that. The app is what "run this project"
# means; `calpo` is reached with `--bin calpo`.
default-run = "calenpomo"
# `File::lock` / `try_lock` / `unlock`, which the vault lock is built on, were
# stabilised in 1.89. Stated so an older toolchain fails with that sentence
# rather than with an unresolved-method error.
rust-version = "1.89"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "calenpomo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The desktop app.
[[bin]]
name = "calenpomo"
path = "src/main.rs"
required-features = ["gui"]

# The CLI, reading and writing the same vault. Deliberately outside the `gui`
# feature: `cargo build --bin calpo --no-default-features` has to produce a
# working binary on a machine with none of Tauri's system dependencies
# installed (webkit2gtk and friends on Linux), which is what lets CI build it
# cheaply and lets a user install it without the app.
[[bin]]
name = "calpo"
path = "src/bin/calpo.rs"

[features]
default = ["gui"]
# Everything that needs Tauri: the window, the commands, the four OS
# integrations. The vault, calendar, sessions, timer and fs_atomic modules are
# deliberately *not* in here -- they are what the CLI shares with the app, and
# nothing in them may grow a Tauri dependency.
gui = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-notification",
    "dep:tauri-plugin-global-shortcut",
    "dep:tauri-plugin-autostart",
    "dep:tauri-plugin-updater",
]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
# The tray is core in Tauri v2, not a plugin, but it is behind a feature flag.
# `image-png` is deliberately not enabled: the tray reuses the icon that
# `generate_context!` already embeds as raw RGBA, so nothing decodes a PNG at
# runtime.
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
# Not target-gated. The app is desktop-only regardless -- `tauri::tray` is
# itself `cfg(desktop)` -- so gating these would only turn a clear "no tray on
# mobile" error into a confusing missing-crate one.
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
# The only network access in the project, and only when the user asks for it
# from the tray. See `integrations::updates`.
tauri-plugin-updater = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
# iCalendar parsing and serialising. The `recurrence` feature is the `rrule`
# crate underneath, which is what expands RRULE -- no part of RFC 5545 is
# reimplemented here.
icalendar = { version = "0.17", features = ["recurrence"] }
chrono = { version = "0.4", features = ["serde"] }
# Already in the tree via icalendar's `recurrence` feature, but named here
# because we resolve `TZID` parameters ourselves when reading a hand-written or
# imported file.
chrono-tz = "0.10"
# The CLI's argument parser. Not optional: keeping it unconditional is what lets
# the documented `cargo test` command cover the CLI without a second invocation.
clap = { version = "4", features = ["derive"] }
# How the CLI finds the same config directory the app uses. Tauri's
# `app_config_dir()` is `dirs::config_dir()/${identifier}` and nothing more
# (tauri/src/path/desktop.rs), so this reproduces it exactly rather than
# guessing at platform conventions. Already in the tree via Tauri itself.
dirs = "6"
interprocess = "2.4.3"
ctrlc = "3.5.2"

# Nothing here for the vault lock on purpose: `File::lock`/`try_lock`/`unlock`
# have been in std since Rust 1.89, so `fs4` and friends would buy nothing.

# `fsync` alone does not force a flush to the device on macOS; `F_FULLFSYNC` does.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

